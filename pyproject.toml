[project]
name = "agentic-rag"
version = "0.1.0"
description = "RAG agêntico vs RAG simples — projeto didático com OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "numpy>=2.5.3",
    "openai>=3.26.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
rag = "agentic_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
